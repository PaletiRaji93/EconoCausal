
[pytest]

# Collect tests only from the main project tests directory.
testpaths = tests

# Ignore extracted copies and generated folders.
norecursedirs =
    EconoCausal_part1_2
    EconoCausal_part1&2
    EconoCausal_part1
    Econoenv
    .git
    node_modules
    __pycache__

# Display detailed test results.
addopts = -ra
